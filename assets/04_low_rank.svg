<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<rect width="1400" height="650" fill="#fbfbfd"/>
<style>
.t{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#192439}
.h{font-size:40px;font-weight:700}.m{font-size:28px;font-weight:650}.s{font-size:23px}
.eq{font-family:"Cambria Math","STIX Two Math","DejaVu Serif","Times New Roman",serif;font-size:31px;font-style:italic;fill:#192439}
.axis{stroke:#5b6678;stroke-width:2.5}
.bar{fill:#bfc7d3;stroke:#657184;stroke-width:1.5}
.note{fill:#eef2f7;stroke:#c7cfda;stroke-width:1.5;rx:12}
</style>
<text x="700" y="58" text-anchor="middle" class="t h">Singular values 比 rank 提供更细的“方向强度”信息</text>
<line x1="150" y1="480" x2="950" y2="480" class="axis"/>
<line x1="150" y1="480" x2="150" y2="145" class="axis"/>
<rect x="245" y="190" width="120" height="290" class="bar"/>
<rect x="445" y="405" width="120" height="75" class="bar"/>
<rect x="645" y="470" width="120" height="10" class="bar"/>
<text x="305" y="520" text-anchor="middle" class="eq">σ<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<text x="505" y="520" text-anchor="middle" class="eq">σ<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
<text x="705" y="520" text-anchor="middle" class="eq">σ<tspan baseline-shift="sub" font-size="70%">3</tspan></text>
<text x="305" y="175" text-anchor="middle" class="t m">100</text>
<text x="505" y="390" text-anchor="middle" class="t m">8</text>
<text x="705" y="452" text-anchor="middle" class="t m">0.0001</text>

<rect x="1010" y="170" width="310" height="310" class="note"/>
<text x="1165" y="220" text-anchor="middle" class="t m">精确 rank</text>
<text x="1165" y="265" text-anchor="middle" class="t s">三个值都非零</text>
<text x="1165" y="305" text-anchor="middle" class="eq">rank(A)=3</text>
<text x="1165" y="355" text-anchor="middle" class="t m">有效 / 数值 rank</text>
<text x="1165" y="398" text-anchor="middle" class="t s">σ<tspan baseline-shift="sub" font-size="70%">3</tspan><tspan baseline-shift="baseline" font-size="100%"> 几乎不起作用</tspan></text>
<text x="1165" y="440" text-anchor="middle" class="eq">A ≈ σ<tspan baseline-shift="sub" font-size="70%">1</tspan><tspan baseline-shift="baseline" font-size="100%">u</tspan><tspan baseline-shift="sub" font-size="70%">1</tspan><tspan baseline-shift="baseline" font-size="100%">v</tspan><tspan baseline-shift="sub" font-size="70%">1</tspan><tspan baseline-shift="super" font-size="70%">T</tspan><tspan baseline-shift="baseline" font-size="100%"> + σ</tspan><tspan baseline-shift="sub" font-size="70%">2</tspan><tspan baseline-shift="baseline" font-size="100%">u</tspan><tspan baseline-shift="sub" font-size="70%">2</tspan><tspan baseline-shift="baseline" font-size="100%">v</tspan><tspan baseline-shift="sub" font-size="70%">2</tspan><tspan baseline-shift="super" font-size="70%">T</tspan></text>

<text x="700" y="595" text-anchor="middle" class="t s">rank 只告诉“有几个非零方向”；singular values 还告诉“每个方向到底有多强”</text>
</svg>
